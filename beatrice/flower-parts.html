<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>認識花朵的部位</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f6ed;color:#294637;font-family:system-ui,"Microsoft JhengHei",sans-serif}main{max-width:1100px;margin:auto;padding:24px}a{color:#486c4b}header{margin:30px 0}h1{font-size:clamp(28px,5vw,42px);margin:12px 0}p{line-height:1.8}.tag{color:#737b58;font-size:13px;letter-spacing:3px}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}.garden,.info{border:1px solid #e0e5d6;border-radius:28px;padding:24px;background:white}.garden{background:linear-gradient(#fffef9,#edf4e7)}.top,footer{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h2{margin:0}svg{display:block;width:100%;height:auto}svg [data-part]{cursor:pointer}svg [data-part]:hover,svg [data-part].active{filter:drop-shadow(0 0 5px #bc8500)}svg text{font-size:17px;fill:#304c3c;pointer-events:none}.label rect{fill:white;stroke:#a9c09c;stroke-width:1.5}.label.active rect{fill:#ffedaf}.label line{stroke:#809476;stroke-width:1.5;stroke-dasharray:4 3}.info{display:flex;flex-direction:column}.info h2{font-size:28px}.explanation{font-size:19px;min-height:140px}.hint{background:#f1f4e7;padding:16px;border-radius:16px;line-height:1.8}.parts{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.parts button{font:inherit;padding:9px 13px;border:1px solid #bed0b3;border-radius:24px;background:white;color:#34513c;cursor:pointer}.parts button.seen{background:#e2efd8}.parts button[aria-pressed=true]{background:#ffedaf;border-color:#ad7c22}button:focus-visible,a:focus-visible{outline:3px solid #885aba;outline-offset:4px}footer{margin-top:auto;padding-top:16px}.next{background:#315d43;color:white;border:0;border-radius:16px;padding:14px 20px;font:inherit;font-weight:700;cursor:pointer}.note{font-size:13px;color:#66745d}.progress{font-size:14px}@media(max-width:760px){main{padding:16px}.layout{grid-template-columns:1fr}.garden,.info{padding:18px}.explanation{min-height:0}}
</style></head><body><main><a href="index.html">← 回到碧翠絲的遊戲區</a><header><div class="tag">小小植物觀察家</div><h1>認識花朵的部位</h1><p>花朵藏著哪些小祕密？點一點部位，開始探索吧！</p></header><div class="layout"><section class="garden" aria-label="花朵互動圖"><div class="top"><h2 id="flowerName"></h2><span id="round"></span></div><svg id="flower" viewBox="0 0 600 570" role="group" aria-label="花朵簡化剖面圖"></svg><p class="note">這是簡化構造示意圖，幫助我們觀察雄蕊、雌蕊、花瓣和花萼。真實花朵的大小、數量及位置會因花種而不同。</p></section><section class="info" aria-label="部位解說"><div class="tag">點選探索</div><div aria-live="polite" aria-atomic="true"><h2 id="partName"></h2><p class="explanation" id="explanation"></p><div class="hint" id="hint"></div></div><div class="parts" id="parts" aria-label="選擇花朵部位"></div><footer><span class="progress" id="progress"></span><button class="next" id="next">下一朵 →</button></footer></section></div></main><script>
const parts=[
['花瓣','花瓣常有鮮豔的顏色，有些還有香味，可以吸引昆蟲等動物前來幫忙傳粉。','觀察任務：這朵花的花瓣是什麼顏色？'],
['花萼','花萼通常是綠色的。在花還是花苞時，花萼包在外面，保護還沒展開的花。','找找看：花瓣下面的綠色小片片。'],
['雄蕊','雄蕊會產生花粉。花粉被送到雌蕊後，在合適的條件下，可以幫助植物繁殖下一代。','找找看：花朵中央周圍，頂端黃色、細細長長的部位。'],
['雌蕊','雌蕊能接收花粉。完成受精後，雌蕊下方膨大的部分通常會發育成果實，裡面則會形成種子。','找找看：花朵中央綠色、上面細長、下面膨大的部位。']];
const flowers=[{name:'粉紅花朵',color:'#f09bad',dark:'#c65f80',n:5},{name:'紫色花朵',color:'#c6afe7',dark:'#9369be',n:6},{name:'金黃花朵',color:'#f5d17d',dark:'#c69b39',n:5}];
let index=0,round=1,seen=new Set();const $=id=>document.getElementById(id);
function select(i){seen.add(i);$('partName').textContent=parts[i][0];$('explanation').textContent=parts[i][1];$('hint').textContent=parts[i][2];document.querySelectorAll('[data-part]').forEach(el=>el.classList.toggle('active',Number(el.dataset.part)===i));document.querySelectorAll('.parts button').forEach((b,j)=>{b.classList.toggle('seen',seen.has(j));b.setAttribute('aria-pressed',String(j===i))});$('progress').textContent=seen.size===parts.length?'全部發現了！真棒！':'已探索 '+seen.size+' / '+parts.length+' 個部位'}
function draw(){const f=flowers[index];seen=new Set();$('flowerName').textContent=f.name;$('round').textContent='第 '+round+' 朵';let petals='';for(let i=0;i<f.n;i++)petals+=`<ellipse cx="300" cy="205" rx="65" ry="120" transform="rotate(${i*360/f.n} 300 285)" fill="${f.color}" stroke="${f.dark}" stroke-width="2" opacity=".9"/>`;
$('flower').innerHTML=`<path d="M300 465 Q285 510 300 550" fill="none" stroke="#59864e" stroke-width="16"/><path d="M296 508 Q235 455 228 490 Q250 527 296 520" fill="#82a669"/><g data-part="0">${petals}</g><path d="M300 405 Q232 414 222 362 Q267 375 300 395 Q333 375 378 362 Q368 414 300 405" fill="#6f9a58" stroke="#527a3c" stroke-width="2" data-part="1"/><ellipse cx="300" cy="448" rx="34" ry="17" fill="#678b42"/><g data-part="2" stroke="#ce9b44" stroke-width="7"><path d="M280 378 L237 269 M320 378 L363 269 M280 375 L258 243 M320 375 L342 243"/></g><g data-part="2" fill="#e9b42f" stroke="#ae791e" stroke-width="2"><ellipse cx="237" cy="264" rx="14" ry="23" transform="rotate(-25 237 264)"/><ellipse cx="363" cy="264" rx="14" ry="23" transform="rotate(25 363 264)"/><ellipse cx="258" cy="237" rx="13" ry="21"/><ellipse cx="342" cy="237" rx="13" ry="21"/></g><path d="M300 235 L300 375" stroke="#709d61" stroke-width="15" data-part="3"/><path d="M281 227 Q300 211 319 227 Q319 243 300 241 Q281 243 281 227" fill="#91b66e" stroke="#527a3c" stroke-width="2" data-part="3"/><ellipse cx="300" cy="400" rx="30" ry="43" fill="#e4edbd" stroke="#72944f" stroke-width="5" data-part="3"/><g data-part="3" fill="#b9ca74" stroke="#698d43" stroke-width="2"><ellipse cx="289" cy="390" rx="7" ry="10"/><ellipse cx="310" cy="408" rx="7" ry="10"/><ellipse cx="288" cy="420" rx="7" ry="10"/></g>`;
const labels=[[0,35,110,232,195],[1,35,360,247,388],[2,440,175,350,243],[3,35,235,295,280]];
labels.forEach(([i,x,y,tx,ty])=>{$('flower').insertAdjacentHTML('beforeend',`<g class="label" data-part="${i}" aria-hidden="true"><line x1="${x+42}" y1="${y+19}" x2="${tx}" y2="${ty}"/><rect x="${x}" y="${y}" width="84" height="38" rx="14"/><text x="${x+42}" y="${y+25}" text-anchor="middle">${parts[i][0]}</text></g>`)});
$('parts').innerHTML='';parts.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p[0];b.setAttribute('aria-pressed','false');b.onclick=()=>select(i);$('parts').append(b)});$('progress').textContent='已探索 0 / '+parts.length+' 個部位';$('partName').textContent='一起探索這朵花！';$('explanation').textContent='點選圖上的部位或下方按鈕，看看它有什麼工作。每一朵都可以自由探索，也可以隨時換下一朵。';$('hint').textContent='先找找看：花瓣下面的花萼在哪裡？'}
$('flower').addEventListener('click',e=>{const p=e.target.closest('[data-part]');if(p)select(Number(p.dataset.part))});$('next').onclick=()=>{index=(index+1)%flowers.length;round++;draw()};draw();
</script></body></html>
